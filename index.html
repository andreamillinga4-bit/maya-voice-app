<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maya Voice Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
        }
        h2 { margin-bottom: 10px; color: #4CAF50; }
        p { color: #b0b0b0; font-size: 14px; margin-bottom: 20px; }
        .mic-btn {
            background-color: #ff4081;
            color: white;
            border: none;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 64, 129, 0.4);
            transition: 0.3s;
        }
        .mic-btn.active {
            background-color: #f44336;
            transform: scale(1.1);
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            font-size: 15px;
            color: #ffeb3b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Maya Voice Live</h2>
        <p>Gusa kitufe ili uanze kuongea na AI kwa wakati halisi.</p>
        
        <button id="micBtn" class="mic-btn" onclick="toggleListening()">🎤</button>
        <div id="status">Imesimama. Gusa kuongea.</div>
    </div>

    <script>
        let isListening = false;
        const statusDiv = document.getElementById("status");
        const micBtn = document.getElementById("micBtn");

        // Kutumia Web Speech API iliyopo ndani ya vivinjari vya simu (Inasikia na kujibu bila kukata)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            statusDiv.innerText = "Kivinjari chako hakiauni huduma hii ya sauti.";
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'sw-TZ'; // Unaweza kuweka 'en-US' au 'sw-TZ'
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = function() {
                isListening = true;
                micBtn.classList.add("active");
                statusDiv.innerText = "Inasikiliza sauti yako...";
            };

            recognition.onresult = function(event) {
                const userSpeech = event.results[0][0].transcript;
                statusDiv.innerText = "Umesema: \"" + userSpeech + "\"";
                
                // Hapa ndipo ujumbe unatumπεwa kwenye AI API yetu (DeepInfra / Llama)
                sendToAI(userSpeech);
            };

            recognition.onerror = function(event) {
                statusDiv.innerText = "Hitilafu imetokea: " + event.error;
                stopListeningState();
            };

            recognition.onend = function() {
                stopListeningState();
            };

            function toggleListening() {
                if (!isListening) {
                    try {
                        recognition.start();
                    } catch (e) {
                        console.log(e);
                    }
                } else {
                    recognition.stop();
                }
            }

            function stopListeningState() {
                isListening = false;
                micBtn.classList.remove("active");
            }
        }

        async function sendToAI(text) {
            statusDiv.innerText = "Maya anawaza jibu...";
            const apiKey = "NNv3FLASzkRSgOTnivuuWyUWmIriGcuQ";
            const apiUrl = "https://api.deepinfra.com/v1/openai/chat/completions";

            try {
                const response = await fetch(apiUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + apiKey
                    },
                    body: JSON.stringify({
                        model: "meta-llama/Meta-Llama-3-70B-Instruct",
                        messages: [{ role: "user", content: text }]
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices.length > 0) {
                    const aiReply = data.choices[0].message.content;
                    statusDiv.innerText = "Maya: " + aiReply;
                    
                    // Kusoma jibu kwa sauti (Text-to-Speech)
                    speakText(aiReply);
                } else {
                    statusDiv.innerText = "Samahani, sikupata jibu.";
                }
            } catch (error) {
                statusDiv.innerText = "Kosa la mtandao limetokea.";
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'sw-TZ'; // Inasoma kwa lugha ya Kiswahili au Kiingereza
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
