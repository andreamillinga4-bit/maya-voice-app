<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maya Live Voice AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #1e293b;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
        }
        h2 { color: #38bdf8; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
        .mic-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }
        .mic-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: 0.3s;
            z-index: 2;
        }
        .mic-btn.active {
            background-color: #ef4444;
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.6);
        }
        #status {
            font-weight: bold;
            font-size: 15px;
            color: #facc15;
            min-height: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Maya Live AI</h2>
        <p>Ongea na Maya kwa wakati halisi kupitia sauti.</p>
        
        <div class="mic-container">
            <button id="micBtn" class="mic-btn" onclick="toggleVoiceSession()">🎙️</button>
        </div>
        
        <div id="status">Gusa kitufe kuanza mazungumzo.</div>
    </div>

    <script>
        let isSessionActive = false;
        let recognition = null;
        const statusDiv = document.getElementById("status");
        const micBtn = document.getElementById("micBtn");

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            statusDiv.innerText = "Kivinjari chako hakiwezeshi huduma hii ya sauti.";
        } else {
            recognition = new SpeechRecognition();
            recognition.lang = 'sw-TZ';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = function() {
                statusDiv.innerText = "Maya anasikiliza sauti yako...";
            };

            recognition.onresult = function(event) {
                const userSpeech = event.results[0][0].transcript;
                statusDiv.innerText = "Umesema: \"" + userSpeech + "\"";
                
                // Mfumo unazuia kusikiliza wakati AI anajibu (kama ilivyo kwenye mchoro: Mute/Discard Chunk wakati spika inafanya kazi)
                sendToAI(userSpeech);
            };

            recognition.onerror = function(event) {
                statusDiv.innerText = "Hitilafu: " + event.error;
                if (isSessionActive) recognition.start();
            };

            recognition.onend = function() {
                if (isSessionActive) {
                    try { recognition.start(); } catch(e) {}
                }
            }
        }

        function toggleVoiceSession() {
            if (!SpeechRecognition) return;
            
            if (!isSessionActive) {
                isSessionActive = true;
                micBtn.classList.add("active");
                try { recognition.start(); } catch(e) {}
            } else {
                isSessionActive = false;
                micBtn.classList.remove("active");
                try { recognition.stop(); } catch(e) {}
                window.speechSynthesis.cancel();
                statusDiv.innerText = "Mzunguko umesimamishwa.";
            }
        }

        async function sendToAI(text) {
            statusDiv.innerText = "Maya anawaza...";
            const apiKey = "NNv3FLASzkRSgOTnivuuWyUWmIriGcuQ";
            const apiUrl = "https://api.deepinfra.com/v1/openai/chat/completions";

            try {
                const response = await fetch(apiUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + apiKey
                    },
                    body: JSON.stringify({
                        model: "meta-llama/Meta-Llama-3-70B-Instruct",
                        messages: [{ role: "user", content: text }]
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices.length > 0) {
                    const aiReply = data.choices[0].message.content;
                    statusDiv.innerText = "Maya: " + aiReply;
                    
                    // Cheza jibu kupitia spika (Speaker Loop)
                    speakResponse(aiReply);
                } else {
                    statusDiv.innerText = "Samahani, sikupata jibu sahihi.";
                }
            } catch (error) {
                statusDiv.innerText = "Tatizo la mtandao limetokea.";
            }
        }

        function speakResponse(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Futa sauti zilizopita
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'sw-TZ';
                
                utterance.onend = function() {
                    // Baada ya spika kumaliza kuongea, huruhusu mfumo kusikiliza tena (Loop inarudi juu kwa User)
                    statusDiv.innerText = "Endelea kuongea, Maya anasikiliza...";
                };

                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
